name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: make compile
      - name: Run tests
        run: make test
      - name: Build Docker image
        run: docker build -t de-eng-web:test .
