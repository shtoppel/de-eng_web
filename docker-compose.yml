services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_DB_PATH: /data/words.db
    volumes:
      - words-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  words-data:
